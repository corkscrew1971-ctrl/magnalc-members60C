<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>熊本マグナライオンズクラブ 会員名簿</title>
<style>
  :root{
    --navy:#13213c;
    --navy-deep:#0a1326;
    --gold:#c9a04a;
    --gold-bright:#e3bc63;
    --cream:#f6f1e6;
    --ink:#23211d;
    --line:#3a4a6b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    background:var(--navy-deep);
    color:var(--cream);
  }

  /* ---------- GATE ---------- */
  #gate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 50% 20%, var(--navy) 0%, var(--navy-deep) 70%);
    padding:24px;
  }
  .gate-card{
    width:100%;
    max-width:380px;
    text-align:center;
  }
  .emblem{
    width:64px;height:64px;
    margin:0 auto 20px;
    border:2px solid var(--gold);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:"Times New Roman",serif;
    font-size:28px;
    color:var(--gold-bright);
    letter-spacing:1px;
  }
  .gate-card h1{
    font-size:18px;
    letter-spacing:.15em;
    font-weight:500;
    margin:0 0 4px;
    color:var(--cream);
  }
  .gate-card p.sub{
    font-size:12px;
    letter-spacing:.2em;
    color:var(--gold);
    margin:0 0 32px;
    font-family:"Helvetica Neue",Arial,sans-serif;
  }
  #passInput{
    width:100%;
    padding:14px 16px;
    background:transparent;
    border:1px solid var(--line);
    color:var(--cream);
    font-size:15px;
    letter-spacing:.1em;
    text-align:center;
    border-radius:2px;
    outline:none;
    font-family:"Helvetica Neue",Arial,sans-serif;
  }
  #passInput:focus{border-color:var(--gold);}
  #gateBtn{
    margin-top:14px;
    width:100%;
    padding:14px;
    background:var(--gold);
    color:var(--navy-deep);
    border:none;
    border-radius:2px;
    font-size:13px;
    letter-spacing:.2em;
    cursor:pointer;
    font-family:"Helvetica Neue",Arial,sans-serif;
    transition:background .2s;
  }
  #gateBtn:hover{background:var(--gold-bright);}
  #gateErr{
    margin-top:14px;
    font-size:12px;
    color:#d98b8b;
    font-family:"Helvetica Neue",Arial,sans-serif;
    min-height:16px;
    letter-spacing:.05em;
  }

  /* ---------- DIRECTORY ---------- */
  #directory{display:none;}
  header.top{
    background:var(--navy);
    border-bottom:1px solid var(--line);
    padding:40px 24px 32px;
    text-align:center;
    position:relative;
  }
  header.top::after{
    content:"";
    position:absolute;
    bottom:0;left:50%;
    transform:translateX(-50%);
    width:120px;height:1px;
    background:var(--gold);
  }
  header.top .eyebrow{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:11px;
    letter-spacing:.3em;
    color:var(--gold);
    margin-bottom:10px;
  }
  header.top h1{
    font-size:clamp(22px,4vw,32px);
    margin:0 0 6px;
    font-weight:500;
    letter-spacing:.05em;
  }
  header.top .count{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:12px;
    color:#9aa6c2;
    letter-spacing:.05em;
  }

  .toolbar{
    max-width:1100px;
    margin:28px auto 0;
    padding:0 24px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
  }
  #search{
    flex:1;
    min-width:200px;
    padding:12px 14px;
    background:var(--navy);
    border:1px solid var(--line);
    color:var(--cream);
    border-radius:2px;
    font-size:14px;
    font-family:"Helvetica Neue",Arial,sans-serif;
    outline:none;
  }
  #search:focus{border-color:var(--gold);}
  #search::placeholder{color:#6b7796;}

  .grid{
    max-width:1100px;
    margin:24px auto 80px;
    padding:0 24px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:18px;
  }
  .card{
    background:var(--navy);
    border:1px solid var(--line);
    border-radius:3px;
    padding:20px;
    display:flex;
    gap:16px;
    align-items:flex-start;
    transition:border-color .2s, transform .2s;
  }
  .card:hover{border-color:var(--gold); transform:translateY(-2px);}
  .avatar{
    width:64px;height:80px;
    border-radius:4px;
    background:linear-gradient(135deg,var(--gold) 0%, #8a6a28 100%);
    color:var(--navy-deep);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
    font-weight:600;
    flex-shrink:0;
    font-family:"Helvetica Neue",Arial,sans-serif;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .avatar img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .info{flex:1; min-width:0;}
  .info .name{
    font-size:17px;
    margin:0 0 6px;
    color:var(--cream);
    letter-spacing:.03em;
  }
  .info .name .furigana-tag{
    display:inline-block;
    font-size:10px;
    font-family:"Helvetica Neue",Arial,sans-serif;
    color:var(--gold);
    border:1px solid var(--gold);
    border-radius:10px;
    padding:1px 7px;
    margin-left:8px;
    vertical-align:middle;
    letter-spacing:.1em;
  }
  .info dl{
    margin:0;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:12.5px;
    color:#b9c2da;
    line-height:1.7;
  }
  .info dl div{display:flex; gap:8px;}
  .info dl dt{color:#6b7796; width:54px; flex-shrink:0;}
  .info dl dd{margin:0;}

  .empty{
    text-align:center;
    color:#6b7796;
    font-family:"Helvetica Neue",Arial,sans-serif;
    padding:60px 20px;
    grid-column:1/-1;
  }

  footer.bottom{
    text-align:center;
    padding:24px;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:11px;
    color:#5a6588;
    letter-spacing:.1em;
    border-top:1px solid var(--line);
  }

  @media (max-width:480px){
    .card{flex-direction:column; align-items:flex-start;}
  }
</style>
</head>
<body>

<!-- ===== ACCESS GATE ===== -->
<div id="gate">
  <div class="gate-card">
    <div class="emblem">L</div>
    <h1>熊本マグナライオンズクラブ</h1>
    <p class="sub">MEMBER&nbsp;DIRECTORY&nbsp;&middot;&nbsp;60th&nbsp;ANNIVERSARY</p>
    <input type="password" id="passInput" placeholder="パスコードを入力" autocomplete="off">
    <button id="gateBtn">入室する</button>
    <div id="gateErr"></div>
  </div>
</div>

<!-- ===== DIRECTORY ===== -->
<div id="directory">
  <header class="top">
    <div class="eyebrow">KUMAMOTO MAGNA LIONS CLUB &middot; 60th ANNIVERSARY</div>
    <h1>会員紹介</h1>
    <div class="count" id="countLabel"></div>
  </header>

  <div class="toolbar">
    <input type="text" id="search" placeholder="氏名・会社名で検索…">
  </div>

  <div class="grid" id="grid"></div>

  <footer class="bottom">この名簿はURLを知る会員限定の限定公開ページです。第三者への共有はご遠慮ください。</footer>
</div>

// ------- パスコード設定（必要に応じて変更してください） -------
const PASSCODE = "magna60";

const gate = document.getElementById('gate');
const directory = document.getElementById('directory');
const gateBtn = document.getElementById('gateBtn');
const passInput = document.getElementById('passInput');
const gateErr = document.getElementById('gateErr');

function unlock(){
  gate.style.display = 'none';
  directory.style.display = 'block';
  sessionStorage.setItem('magna_unlocked','1');
  renderGrid(members);
}

gateBtn.addEventListener('click', () => {
  if(passInput.value.trim() === PASSCODE){
    unlock();
  } else {
    gateErr.textContent = "パスコードが正しくありません。";
    passInput.value = "";
    passInput.focus();
  }
});
passInput.addEventListener('keydown', e => { if(e.key === 'Enter') gateBtn.click(); });

if(sessionStorage.getItem('magna_unlocked') === '1'){
  unlock();
}

function initials(name){
  const part = name.split(' ')[0] || name;
  return part.charAt(0);
}

function renderGrid(list){
  const grid = document.getElementById('grid');
  document.getElementById('countLabel').textContent = `全 ${members.length} 名`;
  grid.innerHTML = '';
  if(list.length === 0){
    grid.innerHTML = '<div class="empty">該当する会員が見つかりません</div>';
    return;
  }
  list.forEach(m => {
    const card = document.createElement('div');
    card.className = 'card';
    const photoUri = photos[m.name];
    const avatarInner = photoUri
      ? `<img src="${photoUri}" alt="${m.name}">`
      : initials(m.name);
    card.innerHTML = `
      <div class="avatar">${avatarInner}</div>
      <div class="info">
        <p class="name">${m.name}${m.note ? `<span class="furigana-tag">${m.note}</span>` : ''}</p>
        <dl>
          ${m.company ? `<div><dt>会社名</dt><dd>${m.company}</dd></div>` : ''}
          ${m.role ? `<div><dt>役職名</dt><dd>${m.role}</dd></div>` : ''}
          ${m.birth ? `<div><dt>生年月日</dt><dd>${m.birth}</dd></div>` : ''}
          ${m.joined ? `<div><dt>入会月</dt><dd>${m.joined}</dd></div>` : ''}
        </dl>
      </div>
    `;
    grid.appendChild(card);
  });
}

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim();
  if(!q){ renderGrid(members); return; }
  const filtered = members.filter(m =>
    m.name.includes(q) || (m.company && m.company.includes(q)) || (m.role && m.role.includes(q))
  );
  renderGrid(filtered);
});
</script>
</body>
</html>
